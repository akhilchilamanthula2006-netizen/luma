<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="clip"><circle cx="60" cy="60" r="58"/></clipPath>
    <radialGradient id="grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#grad)"/>
  <g clip-path="url(#clip)">
    <!-- Shirt -->
    <path d="M18 122 Q18 90 60 88 Q102 90 102 122Z" fill="#F97316"/>
    <!-- Neck -->
    <rect x="52" y="72" width="16" height="18" rx="4" fill="#E6B585"/>
