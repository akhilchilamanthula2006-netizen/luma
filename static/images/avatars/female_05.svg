    <circle cx="53" cy="50" r="1" fill="#fff"/>
    <path d="M64 51 Q68 47 72 51" stroke="#6B1C00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Nose -->
