    <ellipse cx="36" cy="55" rx="3" ry="4" fill="#FDDBB5"/>
    <ellipse cx="84" cy="55" rx="5" ry="6" fill="#FAD5A5"/>
    <ellipse cx="84" cy="55" rx="3" ry="4" fill="#FDDBB5"/>
    <!-- Hair Base / Hair Back -->
