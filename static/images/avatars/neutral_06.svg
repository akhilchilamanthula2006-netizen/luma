    <circle cx="68" cy="51" r="2.8" fill="#0F172A"/>
    <circle cx="69" cy="50" r="1" fill="#fff"/>
    
    <!-- Nose -->
    <path d="M58 57 Q60 61 62 57" stroke="#4A2B0F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Mouth -->
