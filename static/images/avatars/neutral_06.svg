    <ellipse cx="36" cy="55" rx="3" ry="4" fill="#603813"/>
    <ellipse cx="84" cy="55" rx="5" ry="6" fill="#4A2B0F"/>
    <ellipse cx="84" cy="55" rx="3" ry="4" fill="#603813"/>
    <!-- Hair Base / Hair Back -->
    <path d="M38 45 Q38 22 60 23 Q82 22 82 45 Q78 30 60 30 Q42 30 38 45Z" fill="#0F172A"/>
