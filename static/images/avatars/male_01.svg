<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <clipPath id="clip"><circle cx="60" cy="60" r="58"/></clipPath>
    <radialGradient id="grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#grad)"/>
  <g clip-path="url(#clip)">
    <!-- Shirt -->
    <path d="M18 122 Q18 90 60 88 Q102 90 102 122Z" fill="#1D4ED8"/>
    <!-- Neck -->
    <rect x="52" y="72" width="16" height="18" rx="4" fill="#6B3A2A"/>
    <!-- Head -->
    <ellipse cx="60" cy="54" rx="24" ry="27" fill="#7B4A32"/>
    <!-- Ears -->
    <ellipse cx="36" cy="55" rx="5" ry="6" fill="#6B3A2A"/>
    <ellipse cx="36" cy="55" rx="3" ry="4" fill="#7B4A32"/>
    <ellipse cx="84" cy="55" rx="5" ry="6" fill="#6B3A2A"/>
    <ellipse cx="84" cy="55" rx="3" ry="4" fill="#7B4A32"/>
    <!-- Hair Base / Hair Back -->
    <ellipse cx="60" cy="31" rx="24" ry="10" fill="#1C1917"/><ellipse cx="40" cy="40" rx="10" ry="8" fill="#1C1917"/><ellipse cx="80" cy="40" rx="10" ry="8" fill="#1C1917"/>
    <!-- Eyebrows -->
    <path d="M48 45 Q54 42 58 45" stroke="#1C1917" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M62 45 Q66 42 72 45" stroke="#1C1917" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    
    <ellipse cx="52" cy="51" rx="4.5" ry="4" fill="#fff"/>
    <circle cx="52" cy="51" r="2.8" fill="#1C1917"/>
    <circle cx="53" cy="50" r="1" fill="#fff"/>
    <ellipse cx="68" cy="51" rx="4.5" ry="4" fill="#fff"/>
    <circle cx="68" cy="51" r="2.8" fill="#1C1917"/>
    <circle cx="69" cy="50" r="1" fill="#fff"/>
    
    <!-- Nose -->
    <path d="M58 57 Q60 62 62 57" stroke="#6B3A2A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Mouth -->
    <path d="M52 65 Q60 72 68 65" stroke="#6B3A2A" stroke-width="2" fill="none" stroke-linecap="round"/>
    
  </g>
