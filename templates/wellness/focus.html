{% extends "app_shell.html" %}

{% block title %}Focus Mode — Luma Wellness{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-8 pb-12">
    
    <div class="flex items-center gap-3">
        <a href="{{ url_for('wellness.index') }}" class="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Focus Mode</h1>
            <p class="text-sm text-slate-500">Pomodoro and Deep Work blocks for high productivity and burnout prevention.</p>
        </div>
    </div>

    <!-- Focus Timer Card -->
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center space-y-8">
        
        <!-- Preset Mode Selector -->
        <div class="inline-flex p-1 bg-slate-100 rounded-xl">
            <button onclick="setFocusPreset('pomodoro', 25, 5)" id="preset-pomo" class="px-5 py-2 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-900 transition">Pomodoro (25/5m)</button>
            <button onclick="setFocusPreset('deep_work', 50, 10)" id="preset-deep" class="px-5 py-2 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition">Deep Work (50/10m)</button>
        </div>

        <!-- Timer Display -->
        <div class="w-56 h-56 mx-auto rounded-full border-4 border-indigo-500/30 flex items-center justify-center bg-indigo-500/5">
            <div class="space-y-2">
                <span id="focus-timer-display" class="text-5xl font-extrabold text-slate-900">25:00</span>
                <p id="focus-phase" class="text-xs font-semibold text-indigo-600 uppercase tracking-wider">Work Phase</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="space-y-4">
            <p id="interval-counter" class="text-xs text-slate-500">Completed 0 work intervals</p>
            <div class="flex items-center justify-center gap-4">
                <button id="btn-focus-start" onclick="toggleFocus()" class="px-8 py-3 bg-indigo-600 text-white font-semibold text-sm rounded-xl shadow hover:bg-indigo-700 transition">
                    Start Focus Block
                </button>
            </div>
        </div>

    </div>

</div>

<script>
    let mode = 'pomodoro';
    let workMins = 25;
    let breakMins = 5;
    let secondsLeft = 1500;
    let isWorking = true;
    let isFocusing = false;
    let focusTimerId = null;
    let completedIntervals = 0;

    function setFocusPreset(m, w, b) {
        if (isFocusing) toggleFocus();
        mode = m;
        workMins = w;
        breakMins = b;
        secondsLeft = w * 60;
        isWorking = true;

        document.getElementById('preset-pomo').className = m === 'pomodoro' ? "px-5 py-2 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-900 transition" : "px-5 py-2 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition";
        document.getElementById('preset-deep').className = m === 'deep_work' ? "px-5 py-2 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-900 transition" : "px-5 py-2 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition";

        document.getElementById('focus-phase').textContent = "Work Phase";
        updateDisplay();
    }

    function updateDisplay() {
        const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
        const s = (secondsLeft % 60).toString().padStart(2, '0');
        document.getElementById('focus-timer-display').textContent = `${m}:${s}`;
    }

    function toggleFocus() {
        const btn = document.getElementById('btn-focus-start');
        if (isFocusing) {
            isFocusing = false;
            clearInterval(focusTimerId);
            btn.textContent = 'Resume Focus';
            btn.className = 'px-8 py-3 bg-indigo-600 text-white font-semibold text-sm rounded-xl shadow hover:bg-indigo-700 transition';
        } else {
            isFocusing = true;
            btn.textContent = 'Pause Focus';
            btn.className = 'px-8 py-3 bg-slate-700 text-white font-semibold text-sm rounded-xl shadow hover:bg-slate-800 transition';

            focusTimerId = setInterval(() => {
                secondsLeft--;
                updateDisplay();
                if (secondsLeft <= 0) {
                    switchPhase();
                }
            }, 1000);
        }
    }

    async function switchPhase() {
        if (isWorking) {
            completedIntervals++;
            document.getElementById('interval-counter').textContent = `Completed ${completedIntervals} work intervals`;
            isWorking = false;
            secondsLeft = breakMins * 60;
            document.getElementById('focus-phase').textContent = "Rest / Break Phase";
            document.getElementById('focus-phase').className = "text-xs font-semibold text-teal-600 uppercase tracking-wider";
        } else {
            isWorking = true;
            secondsLeft = workMins * 60;
            document.getElementById('focus-phase').textContent = "Work Phase";
            document.getElementById('focus-phase').className = "text-xs font-semibold text-indigo-600 uppercase tracking-wider";
        }
        updateDisplay();

        // Log focus block to database
        await fetch('/wellness/api/focus/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                session_type: mode,
                work_duration_minutes: workMins,
                break_duration_minutes: breakMins,
                completed_work_intervals: completedIntervals,
                total_focus_seconds: completedIntervals * workMins * 60,
                interrupted: false
            })
        });

        await fetch('/wellness/api/activities/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ activity_type: 'focus', value: 1 })
        });
    }
</script>
{% endblock %}
