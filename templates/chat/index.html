{% extends "base.html" %}

{% block title %}AI Companion - Luma{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white rounded-2xl border border-slate-100 shadow-xl overflow-hidden flex flex-col h-[75vh]">
        <!-- Chat Header -->
        <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white">
                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="font-bold text-sm">Luma Companion</h2>
                    <span class="text-xs text-teal-400 flex items-center">
                        <span class="w-2 h-2 rounded-full bg-teal-400 mr-1.5 animate-pulse"></span> Empathetic Listener
                    </span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button class="p-2 hover:bg-slate-800 rounded-lg transition text-slate-300">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="flex-grow p-6 overflow-y-auto space-y-4 bg-slate-50/50">
            <!-- Message AI -->
            <div class="flex space-x-3 items-start">
                <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white flex-shrink-0">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                </div>
                <div class="bg-white border border-slate-100 p-4 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm">
                    <p class="text-sm leading-relaxed text-slate-850">
                        Hello! I am Luma, your AI wellness companion. How are you feeling today? You can share whatever is on your mind.
                    </p>
                    <span class="text-[10px] text-slate-400 mt-2 block">System AI</span>
                </div>
            </div>
        </div>

        <!-- Chat Input Footer -->
        <div class="p-4 border-t border-slate-100 bg-white">
            <form class="flex items-center space-x-2" onsubmit="event.preventDefault();">
                <input type="text" placeholder="Type your message here..." class="flex-grow px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm">
                <button type="submit" class="p-3 bg-primary text-white rounded-xl hover:bg-blue-700 transition shadow-md shadow-blue-500/20">
                    <i data-lucide="send" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
