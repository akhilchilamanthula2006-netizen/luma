{% extends "base.html" %}

{% block title %}Login - Luma{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12 bg-gradient-to-b from-slate-50 to-slate-100/50">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-2xl shadow-xl shadow-slate-100/80 border border-slate-150">
        
        <!-- Header -->
        <div class="text-center">
            <!-- Luma Icon Mark -->
            <div class="flex justify-center mb-5">
                <div class="relative w-14 h-14 flex items-center justify-center">
                    <!-- Glow ring -->
                    <div class="absolute inset-0 rounded-2xl" style="background: linear-gradient(135deg, rgba(93,216,208,0.15), rgba(129,140,248,0.15)); border: 1px solid rgba(93,216,208,0.2);"></div>
                    <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <defs>
                            <linearGradient id="auth-login-g" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#5dd8d0"/>
                                <stop offset="1" stop-color="#818cf8"/>
                            </linearGradient>
                        </defs>
                        <line x1="20" y1="9"  x2="11" y2="24" stroke="url(#auth-login-g)" stroke-width="1.3" stroke-opacity="0.4" stroke-linecap="round"/>
                        <line x1="20" y1="9"  x2="29" y2="24" stroke="url(#auth-login-g)" stroke-width="1.3" stroke-opacity="0.4" stroke-linecap="round"/>
                        <line x1="11" y1="24" x2="29" y2="24" stroke="url(#auth-login-g)" stroke-width="1.3" stroke-opacity="0.4" stroke-linecap="round"/>
                        <path d="M 7 32 Q 20 21 33 32" stroke="url(#auth-login-g)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                        <circle cx="20" cy="9"  r="3.2" fill="url(#auth-login-g)"/>
                        <circle cx="11" cy="24" r="2.1" fill="url(#auth-login-g)" fill-opacity="0.72"/>
                        <circle cx="29" cy="24" r="2.1" fill="url(#auth-login-g)" fill-opacity="0.72"/>
                    </svg>
                </div>
            </div>
            <h2 class="text-3xl font-bold tracking-tight text-secondary">Welcome back</h2>
            <p class="mt-2 text-sm text-slate-500">
                Continue your journey to mindfulness
            </p>
        </div>

        <!-- Form -->
        <form class="mt-8 space-y-6" action="{{ url_for('auth.login') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username / Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input id="username" name="username" type="text" required class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm transition duration-200" placeholder="Enter your username">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input id="password" name="password" type="password" required class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm transition duration-200" placeholder="••••••••">
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-primary focus:ring-primary border-slate-350 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-600">Remember me</label>
                </div>
                <a href="#" class="font-medium text-primary hover:underline">Forgot password?</a>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition duration-200 shadow-lg shadow-blue-500/20">
                    Sign In
                </button>
            </div>
        </form>

        <!-- Redirect to Sign up -->
        <div class="text-center text-sm text-slate-500 pt-2">
            Don't have an account? 
            <a href="{{ url_for('auth.signup') }}" class="font-medium text-primary hover:underline">Sign up for free</a>
        </div>
    </div>
</div>
{% endblock %}
