{% extends "base.html" %}

{% block title %}Sign Up - Luma{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12 bg-gradient-to-b from-slate-50 to-slate-100/50">
    <div class="max-w-md w-full space-y-8 bg-white p-8 sm:p-10 rounded-2xl shadow-xl shadow-slate-100/80 border border-slate-150">
        
        <!-- Header -->
        <div class="text-center">
            <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-white mx-auto shadow-md shadow-primary/20 mb-4">
                <i data-lucide="sparkles" class="w-6 h-6"></i>
            </div>
            <h2 class="text-3xl font-bold tracking-tight text-secondary">Begin your journey</h2>
            <p class="mt-2 text-sm text-slate-500">
                Join Luma and discover personalized wellness support
            </p>
        </div>

        <!-- Form -->
        <form class="mt-8 space-y-6" action="{{ url_for('auth.signup') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input id="username" name="username" type="text" required class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm transition duration-200" placeholder="johndoe">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </div>
                        <input id="email" name="email" type="email" required class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm transition duration-200" placeholder="you@example.com">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input id="password" name="password" type="password" required class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm transition duration-200" placeholder="•••••••• (Min. 8 characters)">
                    </div>
                </div>
            </div>

            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input id="terms" name="terms" type="checkbox" required class="h-4 w-4 text-primary focus:ring-primary border-slate-300 rounded">
                </div>
                <div class="ml-3 text-sm">
                    <label for="terms" class="text-slate-500">I agree to the <a href="#" class="font-medium text-primary hover:underline">Terms of Service</a> and <a href="#" class="font-medium text-primary hover:underline">Privacy Policy</a>.</label>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-xl text-white bg-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition duration-200 shadow-lg shadow-blue-500/20">
                    Create Account
                </button>
            </div>
        </form>

        <!-- Redirect to Login -->
        <div class="text-center text-sm text-slate-500 pt-2">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="font-medium text-primary hover:underline">Sign in instead</a>
        </div>
    </div>
</div>
{% endblock %}
